[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "18"

# Next.js configuration
[functions]
  node_bundler = "esbuild"

# Redirects for Next.js routes
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/next"
  status = 200

